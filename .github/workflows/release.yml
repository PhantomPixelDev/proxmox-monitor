name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: ProxmoxWidget-windows
            output-file: ProxmoxWidget-windows.exe
            nuitka-extra: --windows-console-mode=disable --windows-icon-from-ico=src/proxmox_widget/resources/app.ico
          - os: ubuntu-latest
            artifact-name: ProxmoxWidget-linux
            output-file: ProxmoxWidget-linux.bin
            nuitka-extra: ""
          - os: macos-latest
            artifact-name: ProxmoxWidget-macos
            output-file: ProxmoxWidget-macos.bin
            nuitka-extra: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt6 deps for PySide6 / Nuitka onefile runtime
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 || true

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "No extra macOS deps needed for Qt6"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install nuitka ordered-set

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka
            ~/Library/Caches/Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Build with Nuitka
        shell: bash
        run: |
          set -euo pipefail
          echo "Building ${{ matrix.artifact-name }} -> ${{ matrix.output-file }}"
          # Ordered flags exactly as required by spec:
          # --standalone --onefile --enable-plugin=pyside6 --windows-console-mode=disable --windows-icon-from-ico=... --include-data-dir=...
          EXTRA="${{ matrix.nuitka-extra }}"
          python -m nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --include-data-dir=src/proxmox_widget/resources=resources \
            ${EXTRA} \
            --output-filename=${{ matrix.output-file }} \
            --output-dir=dist \
            src/proxmox_widget/__main__.py
          ls -lh dist/
          # Move to dist artifact location and also copy to root for checksum job if needed
          echo "Build done: dist/${{ matrix.output-file }}"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.output-file }}" > "${{ matrix.output-file }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.output-file }}" > "${{ matrix.output-file }}.sha256"
          else
            python -c "import hashlib,pathlib; p=pathlib.Path('${{ matrix.output-file }}'); h=hashlib.sha256(p.read_bytes()).hexdigest(); open(f'${{ matrix.output-file }}.sha256','w').write(f'{h}  ${{ matrix.output-file }}\n')"
          fi
          cat "${{ matrix.output-file }}.sha256"
          # Combined checksums for release job
          cat "${{ matrix.output-file }}.sha256" >> SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/${{ matrix.output-file }}
            dist/${{ matrix.output-file }}.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -R artifacts || true
          find artifacts -type f -ls || true

      - name: Combine SHA256SUMS
        run: |
          set -euo pipefail
          # Each build produced a .sha256; combine into one file
          find artifacts -name "*.sha256" -exec cat {} \; > SHA256SUMS.txt || true
          # Fallback: if per-file sha missing, hash whatever binaries exist
          if [ ! -s SHA256SUMS.txt ]; then
            find artifacts -type f \( -name "*.exe" -o -name "*.bin" \) -exec sha256sum {} \; > SHA256SUMS.txt || true
          fi
          cat SHA256SUMS.txt || echo "no checksums"
          # Copy combined file into artifacts root for release upload
          cp SHA256SUMS.txt artifacts/SHA256SUMS.txt || true
          ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.bin
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
