name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel superseded runs on same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: lint+type+test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 xvfb || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format (check only)
        run: ruff format --check src tests

      - name: Basedpyright
        run: basedpyright src

      - name: Pytest
        run: xvfb-run -a pytest -q --cov=proxmox_widget --cov-report=term-missing --cov-fail-under=70

  ci-compat:
    name: smoke (${{ matrix.os }} py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest smoke (no Qt)
        run: pytest -q -k "not qt" --cov=proxmox_widget --cov-report=term-missing --cov-fail-under=70

  screenshots-guard:
    name: screenshots guard (--mock + diff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 xvfb || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Capture screenshots (--mock, 7 PNGs)
        run: xvfb-run -a python scripts/capture_screenshots.py --mock

      - name: Verify 7 PNGs produced
        run: |
          ls -lh docs/screenshots/
          count=$(ls docs/screenshots/*.png 2>/dev/null | wc -l)
          echo "png count=$count"
          if [ "$count" -ne 7 ]; then echo "::error::expected 7 PNGs, got $count"; exit 1; fi

      - name: Diff against committed screenshots (artifact on drift)
        run: |
          if ! git diff --exit-code -- docs/screenshots; then
            echo "::warning::screenshots drift detected — run 'make screenshots' and commit"
            git diff --stat -- docs/screenshots || true
            exit 1
          fi
          echo "screenshots guard clean"

      - name: Upload screenshots artifact (for diff review)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-drift
          path: docs/screenshots/*.png
          retention-days: 7
