name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: lint+type+test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: |
          if pip show ruff >/dev/null 2>&1; then
            ruff check src tests
          else
            echo "ruff not installed, skipping"
          fi

      - name: Ruff format (check only)
        run: |
          if pip show ruff >/dev/null 2>&1; then
            ruff format --check src tests || echo "::warning::ruff format check failed"
          else
            echo "ruff not installed, skipping"
          fi

      - name: Basedpyright
        run: |
          if pip show basedpyright >/dev/null 2>&1; then
            basedpyright src
          else
            echo "basedpyright not installed, skipping"
          fi

      - name: Pytest
        run: pytest -q
